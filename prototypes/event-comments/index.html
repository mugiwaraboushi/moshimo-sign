<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コメントを送る</title>
<style>
  :root { --accent:#ff9c00; --on-accent:#000; --bg:#0d0f12; --card:#14171b; --line:#22262c; --dim:#8a8f98; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); }
  body { margin:0; color:#e8e6e0;
    font-family:'Hiragino Sans','Noto Sans JP',sans-serif; font-size:15px; line-height:1.7; }
  .wrap { max-width:560px; margin:0 auto; min-height:100svh; display:flex; flex-direction:column;
    padding:28px 16px calc(24px + env(safe-area-inset-bottom)); }
  /* 設定を読み終えるまで文言を伏せる (既定文言 → イベントの文言、とちらつかないように) */
  .wait #title, .wait #lead { visibility:hidden; }
  h1 { font-size:26px; font-weight:700; line-height:1.35; margin:0 0 10px; color:var(--accent);
    letter-spacing:.04em; word-break:break-word; }
  #lead { font-size:15px; color:#c9cdd3; margin:0 0 18px; white-space:pre-wrap; word-break:break-word; }
  textarea { display:block; width:100%; flex:1 0 auto; min-height:38vh; max-height:60vh;
    background:#0f1216; color:#f2f0ea; border:2px solid #2c3138; border-radius:14px;
    padding:14px; font:inherit; font-size:19px; line-height:1.6; resize:none; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .counter { font-size:12px; color:var(--dim); text-align:right; margin:6px 2px 12px; }
  #send { display:block; width:100%; min-height:62px; border:none; border-radius:14px;
    background:var(--accent); color:var(--on-accent); font:inherit; font-size:21px; font-weight:700;
    letter-spacing:.3em; padding-left:.3em; }
  #send:active { transform:translateY(1px); filter:brightness(.92); }
  #send:disabled { opacity:.45; }
  .msg { font-size:14px; margin-top:12px; padding:11px 13px; border-radius:10px; }
  .msg.ok   { background:#132a19; color:#8fe0a6; }
  .msg.err  { background:#2a1616; color:#ff9a8f; }
  .fine { font-size:12px; color:var(--dim); margin-top:14px; line-height:1.7; }
  .test { font-size:11px; color:#6b7280; margin-top:6px; }
  h2 { font-size:12px; font-weight:600; color:var(--dim); letter-spacing:.1em;
    margin:30px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .item { border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:7px;
    background:#111418; font-size:14px; word-break:break-word; }
  .item .t { font-size:10px; color:#6b7280; margin-right:8px; }
  .empty { color:#4b525b; font-size:12px; text-align:center; padding:14px 0; }
  .foot { font-size:10px; color:#4b525b; margin-top:26px; }
  .foot a { color:#8a6a2f; }
</style>
</head>
<body>
<div class="wrap wait" id="wrap">
  <h1 id="title">コメントを送る</h1>
  <p id="lead"></p>

  <textarea id="text" maxlength="100" placeholder=""></textarea>
  <div class="counter"><span id="count">0</span> / <span id="max"></span>文字</div>
  <button id="send">送る</button>
  <div id="result"></div>

  <div class="fine">名前は送られません。書いた内容だけが、運営が確認したあとに表示されます。</div>
  <div class="test" id="test"></div>

  <h2>いま掲示板に流れていることば</h2>
  <div id="feed"><div class="empty">…</div></div>

  <div class="foot">もしも まちと未来の実験室 ／ <a href="../../">プロトタイプ一覧</a></div>
</div>

<script>
// =====================================================================
// 参加者用。スマホから1件送る → 運営が選別 (管理者用ページ) → 承認されたものが実機に流れる。
// タイトル・説明文・色・入力欄のヒントは GAS の ?action=settings から読む (管理者が変えられる)。
// 読めなければ下の既定文言のまま出す。
//
// 置き場は2つある:
//   ローカル … このブラウザの中だけ（1台で通し確認する用。管理者用ページと同じ置き場を見る）
//   GAS      … URLに ?gas=<デプロイID> が付いていればそちら（本番）
// GAS側の実装は tools/event-comments-gas/Code.gs
// =====================================================================

const KEY = "moshimo-event-comments";
const MAX_LEN = 60;          // 実機は64dot幅。長い文は流れきるまで時間がかかる
const DEFAULTS = {
  title: "コメントを送る",
  lead: "いま思ったことを送ってください。運営が確認したものが電光掲示板に流れます。",
  color: "FF9C00",
  placeholder: "質問・コメント・つぶやき、なんでも",
};

const q = new URLSearchParams(location.search);

// ---------------- 接続先 ----------------
// 配布URLは ?gas=<デプロイID> (QRを小さくするための短い形)。古い ?api=<URL> も受け付ける。
// 分割前に配った ?role=post&gas=… もそのまま動く (role は見ない)。
const GAS_PREFIX = "https://script.google.com/macros/s/", GAS_SUFFIX = "/exec";
const API = (() => {
  const id = q.get("gas");
  if (id && /^[\w-]+$/.test(id)) return GAS_PREFIX + id + GAS_SUFFIX;
  try { return q.get("api") || localStorage.getItem(KEY+":api") || ""; } catch { return q.get("api") || ""; }
})();
const online = !!API;

const bc = ("BroadcastChannel" in self) ? new BroadcastChannel(KEY) : null;
const LOCAL = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } },
  save(list){ localStorage.setItem(KEY, JSON.stringify(list)); bc && bc.postMessage("changed"); },
  async add(text){
    const list = this.load();
    const id = list.length ? Math.max(...list.map(c=>c.id)) + 1 : 1;
    list.push({ id, ts:new Date().toISOString(), text, state:"pending" });
    this.save(list);
  },
  async approved(){ return this.load().filter(c => c.state === "approved"); },
};
const REMOTE = {
  async get(action){
    const r = await fetch(API + (API.includes("?") ? "&" : "?") + "action=" + action);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  },
  async add(text){
    // GASは text/plain にしておくとプリフライト(OPTIONS)が飛ばずに済む
    const r = await fetch(API, { method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"add", text }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "エラー");
  },
  // 参加者には承認済みだけ (action=public)。見送ったことばは見せない
  async approved(){
    const j = await this.get("public");
    if (!j.ok) throw new Error(j.error || "エラー");
    return j.comments || [];
  },
};
const store = online ? REMOTE : LOCAL;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hhmm = iso => { const d = new Date(iso);
  return isNaN(d) ? "--:--" : String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

// ---------------- 文言と色 ----------------
function applySettings(s){
  const v = k => (s && typeof s[k] === "string" && s[k].trim()) ? s[k].trim() : DEFAULTS[k];
  $("title").textContent = v("title");
  $("lead").textContent = v("lead");
  $("text").placeholder = v("placeholder");
  document.title = v("title");
  const m = /^#?([0-9a-f]{6})$/i.exec(v("color"));
  const hex = m ? m[1] : DEFAULTS.color;
  const n = parseInt(hex, 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  // 明るい色には黒字、暗い色には白字 (ボタンの文字が読めなくならないように)
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  document.documentElement.style.setProperty("--accent", "#" + hex);
  document.documentElement.style.setProperty("--on-accent", lum > 140 ? "#000" : "#fff");
  // ボタン色の暗い指定は見出しが沈むので、見出しだけは明るさを確保する
  $("title").style.color = lum < 60 ? "#e8e6e0" : "";
  $("wrap").classList.remove("wait");
}

async function loadSettings(){
  if (!online) return applySettings(null);
  // 応答が遅い/落ちているときに文言が出ないままにならないよう、3秒で既定文言に切り替える
  const timer = setTimeout(() => applySettings(null), 3000);
  try {
    const j = await REMOTE.get("settings");
    clearTimeout(timer);
    applySettings(j && j.ok ? j.settings : null);
  } catch (e) {
    clearTimeout(timer);
    applySettings(null);
  }
}

// ---------------- 掲示板に流れていることば ----------------
async function refreshFeed(){
  try {
    const list = (await store.approved()).slice(-5).reverse();
    $("feed").innerHTML = list.length
      ? list.map(c => `<div class="item"><span class="t">${hhmm(c.ts)}</span>${esc(c.text)}</div>`).join("")
      : `<div class="empty">まだありません</div>`;
  } catch (e) {
    $("feed").innerHTML = `<div class="empty">読み込めませんでした</div>`;
  }
}

// ---------------- 送る ----------------
$("max").textContent = MAX_LEN;
const ta = $("text");
// 実機は1行1コメントで受け取るので、改行は空白にして送る
const clean = s => s.replace(/\s*[\r\n]+\s*/g, " ").trim();
ta.oninput = () => {
  const n = [...clean(ta.value)].length;
  $("count").textContent = n;
  $("count").style.color = n > MAX_LEN ? "#ff9a8f" : "";
};
$("send").onclick = async () => {
  const t = clean(ta.value);
  if (!t) { ta.focus(); return; }
  $("send").disabled = true;
  try {
    await store.add(t);
    ta.value = ""; $("count").textContent = "0";
    $("result").innerHTML = `<div class="msg ok">送りました。運営が確認してから掲示板に流れます。</div>`;
    ta.blur();
    refreshFeed();
  } catch (e) {
    $("result").innerHTML = `<div class="msg err">送れませんでした（${esc(e.message)}）。もう一度お試しください。</div>`;
  } finally {
    $("send").disabled = false;
  }
};

if (!online) $("test").textContent = "テスト用：このブラウザの中だけで動いています（本番は配られたURL・QRから開いてください）";
loadSettings();
refreshFeed();
setInterval(refreshFeed, online ? 10000 : 3000);
bc && (bc.onmessage = () => { if (!online) refreshFeed(); });
</script>
</body>
</html>
