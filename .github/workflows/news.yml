name: ニュース見出しの自動取得

# 公開RSSを定期的に取ってきて data/news.json を更新する。
# 電光掲示板のニュース表示 (prototypes/news/) はこのJSONを読む。
on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと（UTC基準・GitHub側の混雑で数分ずれることがある）
  workflow_dispatch:          # 手動実行もできる

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: RSSを取得して data/news.json を更新
        run: node scripts/fetch-news.mjs

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "見出しに変化なし。コミットしません。"
          else
            git commit -m "news: 見出しを更新 [skip ci]"
            git push
          fi
