name: 営業カレンダーで OPEN / CLOSED を切り替え

# data/hours.json の営業時間 (日本時間) を見て playlist.json の topText を
# OPEN / CLOSED に切り替える。実機は playlist.json を約60秒ごとに取りに来るので、
# ここが commit されれば1〜2分で掲示板の上段が変わる。
#
# topText が OPEN / CLOSED 以外 (例「イベント中」) のあいだは、このジョブは何もしない。
on:
  schedule:
    - cron: "*/5 3-11 * * *"  # JST 12:00〜20:59 を5分おき（開店13:00・閉店17:00/19:00をまたぐ帯）
    - cron: "7 * * * *"       # 残りの時間の保険。日付が変わったときの取りこぼし対策
  workflow_dispatch:           # 手動実行もできる

permissions:
  contents: write

concurrency:
  group: open-closed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 営業カレンダーを見て playlist.json を更新
        run: node scripts/update-open-closed.mjs

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          if git diff --staged --quiet; then
            echo "表示は変わりません。コミットしません。"
          else
            git commit -m "playlist: 営業カレンダーに合わせて上段を切り替え [skip ci]"
            git push
          fi
